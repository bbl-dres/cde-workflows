document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"9c507e02-22f2-4d3e-a8e2-77d9ccc20058\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n<meta name=\"design_doc_mode\" content=\"canvas\">\n<style>\n*{box-sizing:border-box}\nbody{margin:0;background:#e6e8ec;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,'Noto Sans',sans-serif;color:#262626}\na{color:#1d7d76;text-decoration:none}\na:hover{color:#10384f;text-decoration:underline}\n<\u002Fstyle>\n<\u002Fhelmet>\n<section style=\"padding:64px;display:flex;flex-direction:column;gap:40px;width:max-content\">\n  <div style=\"display:flex;flex-direction:column;gap:8px;max-width:1400px\">\n    <span style=\"font-size:34px;font-weight:600\">Datenformulare · Übersicht aller Screens<\u002Fspan>\n    <span style=\"font-size:17px;line-height:1.5;color:#3d4650\">Spalten: Datenformulare. Zeilen: Tabs, für alle Formulare in derselben Reihenfolge (Übersicht · Erfassung · Prüfung · Beteiligte · Dokumente · Verlauf); die Ökobilanz erfasst Erstellung und Betrieb in zwei Tabs. Rahmen, Navigation und Komponenten wie in der CDE Bund.<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:200px repeat(5,1320px);gap:56px 40px;align-items:start\">\n    <div><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:4px;padding:0 4px 8px;border-bottom:3px solid #1f2937\">\n      <div style=\"display:flex;align-items:baseline;gap:12px\"><span style=\"font-family:ui-monospace,Consolas,monospace;font-size:16px;background:#1f2937;color:#fff;padding:2px 9px;border-radius:3px\">DWG-EG<\u002Fspan><span style=\"font-size:26px;font-weight:600\">Grundriss EG (Planlieferung)<\u002Fspan><\u002Fdiv>\n      <span style=\"font-size:15px;color:#5b6573\">In Bearbeitung · Alex Beispiel · ein DWG pro Geschoss<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:4px;padding:0 4px 8px;border-bottom:3px solid #1f2937\">\n      <div style=\"display:flex;align-items:baseline;gap:12px\"><span style=\"font-family:ui-monospace,Consolas,monospace;font-size:16px;background:#1f2937;color:#fff;padding:2px 9px;border-radius:3px\">KV-32<\u002Fspan><span style=\"font-size:26px;font-weight:600\">Kostenvoranschlag<\u002Fspan><\u002Fdiv>\n      <span style=\"font-size:15px;color:#5b6573\">In Bearbeitung · Gian Muster<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:4px;padding:0 4px 8px;border-bottom:3px solid #1f2937\">\n      <div style=\"display:flex;align-items:baseline;gap:12px\"><span style=\"font-family:ui-monospace,Consolas,monospace;font-size:16px;background:#1f2937;color:#fff;padding:2px 9px;border-radius:3px\">THG-32<\u002Fspan><span style=\"font-size:26px;font-weight:600\">Ökobilanz Erstellung und Betrieb<\u002Fspan><\u002Fdiv>\n      <span style=\"font-size:15px;color:#5b6573\">In Prüfung · Paula Muster<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:4px;padding:0 4px 8px;border-bottom:3px solid #9ca3af\">\n      <div style=\"display:flex;align-items:baseline;gap:12px\"><span style=\"font-family:ui-monospace,Consolas,monospace;font-size:16px;background:#6b7280;color:#fff;padding:2px 9px;border-radius:3px\">THG-32<\u002Fspan><span style=\"font-size:26px;font-weight:600\">Varianten · Vergleich mit Vorphase<\u002Fspan><\u002Fdiv>\n      <span style=\"font-size:15px;color:#5b6573\">Darstellungen der Tabelle «THG-Emissionen nach Hauptgruppen»: V0 Tabelle bisher, VM Erstellung und Betrieb, VI Rangliste mit Vorphase, VJ Abweichungen, VK Betrieb, VL ohne Vorphase, VA Matrix als Tabelle, VB Matrix, VC Rangliste, VD Rangliste einfarbig, VE Einfluss, VF Hantel, VG Brücke, VH Zusammensetzung<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:4px;padding:0 4px 8px;border-bottom:3px solid #9ca3af\">\n      <div style=\"display:flex;align-items:baseline;gap:12px\"><span style=\"font-family:ui-monospace,Consolas,monospace;font-size:16px;background:#6b7280;color:#fff;padding:2px 9px;border-radius:3px\">THG-32<\u002Fspan><span style=\"font-size:26px;font-weight:600\">Übersicht · bisheriges Design<\u002Fspan><\u002Fdiv>\n      <span style=\"font-size:15px;color:#5b6573\">Referenz: Tabelle Hauptgruppen und Zielwerte mit Kreismarken<\u002Fspan>\n    <\u002Fdiv>\n    <div data-screen-label=\"Übersicht\" style=\"position:sticky;left:0;display:flex;flex-direction:column;gap:6px;padding-top:6px\">\n      <span style=\"font-size:14px;color:#5b6573;font-family:ui-monospace,Consolas,monospace\">Tab 1<\u002Fspan>\n      <span style=\"font-size:24px;font-weight:600\">Übersicht<\u002Fspan>\n      <span style=\"font-size:14px;line-height:1.45;color:#5b6573;text-wrap:pretty\">Status, Kennzahlen, Lieferung, Beteiligte<\u002Fspan>\n    <\u002Fdiv>\n    <div id=\"dwg-uebersicht\" data-screen-label=\"DWG-EG Übersicht\" style=\"display:flex;flex-direction:column;gap:8px;min-width:0\">\n      <span style=\"font-size:13px;color:#5b6573;font-family:ui-monospace,Consolas,monospace\">DWG-EG · Übersicht<\u002Fspan>\n      <div style=\"max-width:1320px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;padding:10px 14px;background:#fff;border:1px solid #d9dde3;border-radius:6px;font-size:13px;line-height:1.45;color:#262626\"><span style=\"font-weight:600;color:#10384f\">Zweck<\u002Fspan><span style=\"text-wrap:pretty\">Stand der Planlieferung eines Geschosses auf einen Blick. Keine Eingaben.<\u002Fspan><span style=\"font-weight:600;color:#10384f\">Inhalt<\u002Fspan><span style=\"text-wrap:pretty\">Kennzahlen (Räume mit AOID, GF), Flächen SIA 416, Prüfregeln nach Kategorie (bestanden / Warnung / Fehler); rechts Lieferung, Verlauf mit nächstem Schritt, Beteiligte.<\u002Fspan><span style=\"font-weight:600;color:#10384f\">Daten<\u002Fspan><span style=\"text-wrap:pretty\">Alle Werte stammen aus der Planprüfung des hochgeladenen DWG.<\u002Fspan><\u002Fdiv>\n      <dc-import name=\"Datenformular\" start-form=\"dwg\" start-tab=\"uebersicht\" show-concept=\"{{ false }}\" show-switcher=\"{{ false }}\" style=\"width:1320px\" hint-size=\"1320px,1000px\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div id=\"kv-uebersicht\" data-screen-label=\"KV-32 Übersicht\" style=\"display:flex;flex-direction:column;gap:8px;min-width:0\">\n      <span style=\"font-size:13px;color:#5b6573;font-family:ui-monospace,Consolas,monospace\">KV-32 · Übersicht<\u002Fspan>\n      <div style=\"max-width:1320px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;padding:10px 14px;background:#fff;border:1px solid #d9dde3;border-radius:6px;font-size:13px;line-height:1.45;color:#262626\"><span style=\"font-weight:600;color:#10384f\">Zweck<\u002Fspan><span style=\"text-wrap:pretty\">Soll/Ist der Kosten für Projektleitung und Prüfung.<\u002Fspan><span style=\"font-weight:600;color:#10384f\">Inhalt<\u002Fspan><span style=\"text-wrap:pretty\">Kennzahlen B–W; Kostenziele (Ist, Ziele, Genauigkeitsband ±10 %); Kosten nach Hauptgruppen als Liste in eBKP-Reihenfolge mit KS-31-Strich, Anteil und Δ, Total und Subtotale C–G, B–W, A–Z.<\u002Fspan><span style=\"font-weight:600;color:#10384f\">Regeln<\u002Fspan><span style=\"text-wrap:pretty\">Ziele (Kostenziel, Kostendach) werden in ePPM verwaltet und sind hier nur lesbar. Markierung ab 10 % und 0.1 Mio.<\u002Fspan><\u002Fdiv>\n      <dc-import name=\"Datenformular\" start-form=\"kv\" start-tab=\"uebersicht\" show-concept=\"{{ false }}\" show-switcher=\"{{ false }}\" style=\"width:1320px\" hint-size=\"1320px,1000px\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div id=\"thg-uebersicht\" data-screen-label=\"THG-32 Übersicht\" style=\"display:flex;flex-direction:column;gap:8px;min-width:0\">\n      <span style=\"font-size:13px;color:#5b6573;font-family:ui-monospace,Consolas,monospace\">THG-32 · Übersicht<\u002Fspan>\n      <div style=\"max-width:1320px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;padding:10px 14px;background:#fff;border:1px solid #d9dde3;border-radius:6px;font-size:13px;line-height:1.45;color:#262626\"><span style=\"font-weight:600;color:#10384f\">Zweck<\u002Fspan><span style=\"text-wrap:pretty\">Ist der Ökobilanz gegen SIA 390/1 und gemeinsame Grundlagen.<\u002Fspan><span style=\"font-weight:600;color:#10384f\">Inhalt<\u002Fspan><span style=\"text-wrap:pretty\">Kennzahlen Erstellung und Betrieb; Grundlagen (Kategorie, Bauvorhaben, EBF/GF aus den Grundrissen, Datenstand) für beide Erfassungs-Tabs; Zielwerte SIA 390/1 (drei Zeilen mit Kreismarken, Legende); «Wo entstehen die Emissionen?» mit Umschalter Erstellung (Hauptgruppen in eBKP-Reihenfolge, SIA-31-Strich, Δ) und Betrieb (nach Energiedienstleistung, PV-Gutschrift grün).<\u002Fspan><span style=\"font-weight:600;color:#10384f\">Regeln<\u002Fspan><span style=\"text-wrap:pretty\">Nur die Zusatzanforderung ist einzuhalten und wird rot markiert; Richtwerte sind informativ. Werte für Verwaltung sind eine Annahme. Zeilen öffnen die Erfassung.<\u002Fspan><\u002Fdiv>\n      <dc-import name=\"Datenformular\" start-form=\"thg\" start-tab=\"uebersicht\" show-concept=\"{{ false }}\" show-switcher=\"{{ false }}\" style=\"width:1320px\" hint-size=\"1320px,1000px\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div id=\"thg-vergleich\" data-screen-label=\"THG-32 Vergleich mit Vorphase\" style=\"display:flex;flex-direction:column;gap:8px;min-width:0\">\n      <span style=\"font-size:13px;color:#5b6573;font-family:ui-monospace,Consolas,monospace\">THG-32 · Vergleich mit Vorphase (Varianten)<\u002Fspan>\n      <div style=\"max-width:1320px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;padding:10px 14px;background:#fff;border:1px solid #d9dde3;border-radius:6px;font-size:13px;line-height:1.45;color:#262626\"><span style=\"font-weight:600;color:#10384f\">Zweck<\u002Fspan><span style=\"text-wrap:pretty\">Exploration für die Karte «THG-Emissionen nach Hauptgruppen». Kein eigener Tab, nicht umsetzen ohne Entscheid.<\u002Fspan><span style=\"font-weight:600;color:#10384f\">Inhalt<\u002Fspan><span style=\"text-wrap:pretty\">Zwölf Varianten VA–VL mit Tags je Rolle und Empfehlung.<\u002Fspan><span style=\"font-weight:600;color:#10384f\">Empfehlung<\u002Fspan><span style=\"text-wrap:pretty\">Übersicht: VM, eine Karte mit Aufteilung Erstellung/Betrieb und Umschalter (Erstellung nach Hauptgruppe wie VI, Betrieb nach Energiedienstleistung wie VK); VL ist der Zustand ohne Vorphase. Prüfung: VJ mit Begründung je markierter Abweichung (nur Erstellung). Zeilen öffnen die Hauptgruppe in der Erfassung. V0 und VA–VK sind Vorstufen.<\u002Fspan><\u002Fdiv><dc-import name=\"Datenformular\" start-form=\"thg\" start-tab=\"vergleich\" show-concept=\"{{ false }}\" show-switcher=\"{{ false }}\" style=\"width:1320px\" hint-size=\"1320px,1000px\"><\u002Fdc-import>\n      \n    <\u002Fdiv>\n    <div data-screen-label=\"Erfassung\" style=\"position:sticky;left:0;display:flex;flex-direction:column;gap:6px;padding-top:6px\">\n      <span style=\"font-size:14px;color:#5b6573;font-family:ui-monospace,Consolas,monospace\">Tab 2<\u002Fspan>\n      <span style=\"font-size:24px;font-weight:600\">Erfassung<\u002Fspan>\n      <span style=\"font-size:14px;line-height:1.45;color:#5b6573;text-wrap:pretty\">Werte erfassen und einreichen<\u002Fspan>\n    <\u002Fdiv>\n    <div id=\"dwg-erfassung\" data-screen-label=\"DWG-EG Erfassung\" style=\"display:flex;flex-direction:column;gap:8px;min-width:0\">\n      <span style=\"font-size:13px;color:#5b6573;font-family:ui-monospace,Consolas,monospace\">DWG-EG · Erfassung<\u002Fspan>\n      <div style=\"max-width:1320px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;padding:10px 14px;background:#fff;border:1px solid #d9dde3;border-radius:6px;font-size:13px;line-height:1.45;color:#262626\"><span style=\"font-weight:600;color:#10384f\">Zweck<\u002Fspan><span style=\"text-wrap:pretty\">Grundriss eines Geschosses liefern; jedes DWG ist eine eigene Lieferung.<\u002Fspan><span style=\"font-weight:600;color:#10384f\">Inhalt<\u002Fspan><span style=\"text-wrap:pretty\">Upload, lokale Prüfung gegen 40 Regeln der CAD-Richtlinie BBL V1.0, Viewer mit Sub-Tabs Prüfregeln, Fehlermeldungen, Räume, Layer, Kennzahlen; Leiste unten (sticky).<\u002Fspan><span style=\"font-weight:600;color:#10384f\">Regeln<\u002Fspan><span style=\"text-wrap:pretty\">Einreichen erst ohne Regel mit Schweregrad Fehler. Die Datei verlässt den Browser nicht.<\u002Fspan><\u002Fdiv>\n      <dc-import name=\"Datenformular\" start-form=\"dwg\" start-tab=\"erfassung\" show-concept=\"{{ false }}\" show-switcher=\"{{ false }}\" style=\"width:1320px\" hint-size=\"1320px,1000px\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div id=\"thg-uebersicht-alt\" data-screen-label=\"THG-32 Übersicht bisher\" style=\"display:flex;flex-direction:column;gap:8px;min-width:0\">\n      <span style=\"font-size:13px;color:#5b6573;font-family:ui-monospace,Consolas,monospace\">THG-32 · Übersicht (bisheriges Design)<\u002Fspan>\n      <dc-import name=\"Datenformular\" start-form=\"thg\" start-tab=\"uebersicht\" legacy-overview=\"{{ true }}\" show-concept=\"{{ false }}\" show-switcher=\"{{ false }}\" style=\"width:1320px\" hint-size=\"1320px,1000px\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div id=\"kv-erfassung\" data-screen-label=\"KV-32 Erfassung\" style=\"display:flex;flex-direction:column;gap:8px;min-width:0\">\n      <span style=\"font-size:13px;color:#5b6573;font-family:ui-monospace,Consolas,monospace\">KV-32 · Erfassung<\u002Fspan>\n      <div style=\"max-width:1320px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;padding:10px 14px;background:#fff;border:1px solid #d9dde3;border-radius:6px;font-size:13px;line-height:1.45;color:#262626\"><span style=\"font-weight:600;color:#10384f\">Zweck<\u002Fspan><span style=\"text-wrap:pretty\">Kostenvoranschlag erfassen; meist nur die Hauptgruppen.<\u002Fspan><span style=\"font-weight:600;color:#10384f\">Inhalt<\u002Fspan><span style=\"text-wrap:pretty\">Betrag je Hauptgruppe direkt; Klick auf die Zeile klappt Positionen auf (Menge + Kosten, Summe ersetzt den Betrag); Code-Dropdown eBKP-H 2020 der Hauptgruppe, + Kostenelement, Papierkorb; Bezugsmenge, Kennwert CHF/m² GF; Total, Lücke, Subtotale C–G, B–W, A–Z.<\u002Fspan><span style=\"font-weight:600;color:#10384f\">Regeln<\u002Fspan><span style=\"text-wrap:pretty\">Leiste mit Vollständigkeit, «Nur fehlende Werte», Einreichen. Nach dem Einreichen gesperrt.<\u002Fspan><\u002Fdiv>\n      <dc-import name=\"Datenformular\" start-form=\"kv\" start-tab=\"erfassung\" show-concept=\"{{ false }}\" show-switcher=\"{{ false }}\" style=\"width:1320px\" hint-size=\"1320px,1000px\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div id=\"thg-erfassung\" data-screen-label=\"THG-32 Erfassung\" style=\"display:flex;flex-direction:column;gap:8px;min-width:0\">\n      <span style=\"font-size:13px;color:#5b6573;font-family:ui-monospace,Consolas,monospace\">THG-32 · Erfassung Erstellung (Status In Bearbeitung)<\u002Fspan>\n      <div style=\"max-width:1320px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;padding:10px 14px;background:#fff;border:1px solid #d9dde3;border-radius:6px;font-size:13px;line-height:1.45;color:#262626\"><span style=\"font-weight:600;color:#10384f\">Zweck<\u002Fspan><span style=\"text-wrap:pretty\">Ergebnisse der Erstellung aus dem Ökobilanztool übernehmen. Die CDE rechnet keine Ökobilanz.<\u002Fspan><span style=\"font-weight:600;color:#10384f\">Inhalt<\u002Fspan><span style=\"text-wrap:pretty\">Grundlagen Erstellung (Systemgrenze, Ökobilanzdaten, Tool, Minergie-ECO GW1, Datenqualität). Tabelle: eine Zeile je Bauteil oder Anlage wie im Tool-Export (z. B. Lesosai «Gd01»), zugeordnet zur eBKP-H-Elementgruppe; Eingaben Referenzgrösse und kg CO₂-eq/m² EBF·a (inkl. Ersatz und Entsorgung), Hersteller-Flag; Anteil berechnet; Total B–G, THGE pro Jahr und über 60 Jahre.<\u002Fspan><span style=\"font-weight:600;color:#10384f\">Regeln<\u002Fspan><span style=\"text-wrap:pretty\">Hauptweg ist «Tool-Export importieren»; Handeingabe für Korrekturen.<\u002Fspan><\u002Fdiv>\n      <dc-import name=\"Datenformular\" start-form=\"thg\" start-tab=\"erfassung\" start-step=\"1\" show-concept=\"{{ false }}\" show-switcher=\"{{ false }}\" style=\"width:1320px\" hint-size=\"1320px,1000px\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div><\u002Fdiv>\n    <div><\u002Fdiv>\n    <div data-screen-label=\"Erfassung Betrieb\" style=\"position:sticky;left:0;display:flex;flex-direction:column;gap:6px;padding-top:6px\">\n      <span style=\"font-size:14px;color:#5b6573;font-family:ui-monospace,Consolas,monospace\">Tab 2b · nur THG-32<\u002Fspan>\n      <span style=\"font-size:24px;font-weight:600\">Erfassung Betrieb<\u002Fspan>\n      <span style=\"font-size:14px;line-height:1.45;color:#5b6573;text-wrap:pretty\">Energiedienstleistungen, Photovoltaik, Stromprodukt<\u002Fspan>\n    <\u002Fdiv>\n    <div><\u002Fdiv>\n    <div><\u002Fdiv>\n    <div id=\"thg-betrieb\" data-screen-label=\"THG-32 Erfassung Betrieb\" style=\"display:flex;flex-direction:column;gap:8px;min-width:0\">\n      <span style=\"font-size:13px;color:#5b6573;font-family:ui-monospace,Consolas,monospace\">THG-32 · Erfassung Betrieb (Status In Bearbeitung)<\u002Fspan>\n      <div style=\"max-width:1320px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;padding:10px 14px;background:#fff;border:1px solid #d9dde3;border-radius:6px;font-size:13px;line-height:1.45;color:#262626\"><span style=\"font-weight:600;color:#10384f\">Zweck<\u002Fspan><span style=\"text-wrap:pretty\">Betrieb nach Rechenhilfe SIA 390/1 erfassen.<\u002Fspan><span style=\"font-weight:600;color:#10384f\">Inhalt<\u002Fspan><span style=\"text-wrap:pretty\">Grundlagen Betrieb (Tool, Stromprodukt, PV-Überschuss); PV (kWp aus D01.01 der Erstellung, Ertrag, Eigenverbrauch); Tabelle Energiedienstleistungen mit einer Zeile je Energieträger: Anteil %, Nutzenergie, η/JAZ, Endenergie, Faktor, THG; Standard-Flag; PV-Eigenverbrauch negativ; Total Betrieb und Subtotale.<\u002Fspan><span style=\"font-weight:600;color:#10384f\">Regeln<\u002Fspan><span style=\"text-wrap:pretty\">Endenergie = Nutzenergie × Anteil / η. Anteile je Dienstleistung = 100 %. Strom-Faktor folgt dem Stromprodukt, andere Träger haben eigene Faktoren (Wasserkraft 0.012 ist eine Annahme).<\u002Fspan><\u002Fdiv>\n      <dc-import name=\"Datenformular\" start-form=\"thg\" start-tab=\"betrieb\" start-step=\"1\" show-concept=\"{{ false }}\" show-switcher=\"{{ false }}\" style=\"width:1320px\" hint-size=\"1320px,1000px\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div><\u002Fdiv>\n    <div><\u002Fdiv>\n    <div data-screen-label=\"Prüfung\" style=\"position:sticky;left:0;display:flex;flex-direction:column;gap:6px;padding-top:6px\">\n      <span style=\"font-size:14px;color:#5b6573;font-family:ui-monospace,Consolas,monospace\">Tab 3<\u002Fspan>\n      <span style=\"font-size:24px;font-weight:600\">Prüfung<\u002Fspan>\n      <span style=\"font-size:14px;line-height:1.45;color:#5b6573;text-wrap:pretty\">Vergleich, Prüfpunkte, Freigabe, Übergabe<\u002Fspan>\n    <\u002Fdiv>\n    <div id=\"dwg-pruefung\" data-screen-label=\"DWG-EG Prüfung\" style=\"display:flex;flex-direction:column;gap:8px;min-width:0\">\n      <span style=\"font-size:13px;color:#5b6573;font-family:ui-monospace,Consolas,monospace\">DWG-EG · Prüfung<\u002Fspan>\n      <div style=\"max-width:1320px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;padding:10px 14px;background:#fff;border:1px solid #d9dde3;border-radius:6px;font-size:13px;line-height:1.45;color:#262626\"><span style=\"font-weight:600;color:#10384f\">Zweck<\u002Fspan><span style=\"text-wrap:pretty\">Prüfung und Freigabe durch das BBL.<\u002Fspan><span style=\"font-weight:600;color:#10384f\">Inhalt<\u002Fspan><span style=\"text-wrap:pretty\">Kompaktes Prüfergebnis, automatische Prüfungen, Checkliste, Kommentar, Zurückweisen / Freigeben, Übergabe an CAFM.<\u002Fspan><span style=\"font-weight:600;color:#10384f\">Regeln<\u002Fspan><span style=\"text-wrap:pretty\">Freigeben erst, wenn alle Prüfpunkte bestätigt sind; Zurückweisen öffnet die Erfassung wieder.<\u002Fspan><\u002Fdiv>\n      <dc-import name=\"Datenformular\" start-form=\"dwg\" start-tab=\"pruefung\" show-concept=\"{{ false }}\" show-switcher=\"{{ false }}\" style=\"width:1320px\" hint-size=\"1320px,1000px\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div id=\"kv-pruefung\" data-screen-label=\"KV-32 Prüfung\" style=\"display:flex;flex-direction:column;gap:8px;min-width:0\">\n      <span style=\"font-size:13px;color:#5b6573;font-family:ui-monospace,Consolas,monospace\">KV-32 · Prüfung<\u002Fspan>\n      <div style=\"max-width:1320px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;padding:10px 14px;background:#fff;border:1px solid #d9dde3;border-radius:6px;font-size:13px;line-height:1.45;color:#262626\"><span style=\"font-weight:600;color:#10384f\">Zweck<\u002Fspan><span style=\"text-wrap:pretty\">Prüfung und Freigabe durch das BBL.<\u002Fspan><span style=\"font-weight:600;color:#10384f\">Inhalt<\u002Fspan><span style=\"text-wrap:pretty\">Vergleich mit KS-31 mit Abweichung (ab 10 % rot), Total und Subtotale; automatische Prüfungen, Checkliste, Kommentar; Übergabe an ePPM.<\u002Fspan><span style=\"font-weight:600;color:#10384f\">Regeln<\u002Fspan><span style=\"text-wrap:pretty\">«Übertragen» erst nach der Freigabe.<\u002Fspan><\u002Fdiv>\n      <dc-import name=\"Datenformular\" start-form=\"kv\" start-tab=\"pruefung\" show-concept=\"{{ false }}\" show-switcher=\"{{ false }}\" style=\"width:1320px\" hint-size=\"1320px,1000px\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div id=\"thg-pruefung\" data-screen-label=\"THG-32 Prüfung\" style=\"display:flex;flex-direction:column;gap:8px;min-width:0\">\n      <span style=\"font-size:13px;color:#5b6573;font-family:ui-monospace,Consolas,monospace\">THG-32 · Prüfung<\u002Fspan>\n      <div style=\"max-width:1320px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;padding:10px 14px;background:#fff;border:1px solid #d9dde3;border-radius:6px;font-size:13px;line-height:1.45;color:#262626\"><span style=\"font-weight:600;color:#10384f\">Zweck<\u002Fspan><span style=\"text-wrap:pretty\">Prüfung und Freigabe durch das BBL.<\u002Fspan><span style=\"font-weight:600;color:#10384f\">Inhalt<\u002Fspan><span style=\"text-wrap:pretty\">Vergleich mit SIA 31 (ab 15 % markiert); automatische Prüfungen: Vollständigkeit, Dokumente, Standard-Grundlagen, Abweichung zur Vorphase, Zusatzanforderung B, Richtwerte (Info), Anteile 100 %, PV in beiden Bereichen, Anteil Gebäudetechnik 15–50 %; Checkliste; Übergabe an SUS / Modell ecCo.<\u002Fspan><span style=\"font-weight:600;color:#10384f\">Regeln<\u002Fspan><span style=\"text-wrap:pretty\">Einzige harte Grenze ist die Zusatzanforderung B; Richtwerte erscheinen nur als Info.<\u002Fspan><\u002Fdiv>\n      <dc-import name=\"Datenformular\" start-form=\"thg\" start-tab=\"pruefung\" show-concept=\"{{ false }}\" show-switcher=\"{{ false }}\" style=\"width:1320px\" hint-size=\"1320px,1000px\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div><\u002Fdiv>\n    <div><\u002Fdiv>\n    <div data-screen-label=\"Beteiligte\" style=\"position:sticky;left:0;display:flex;flex-direction:column;gap:6px;padding-top:6px\">\n      <span style=\"font-size:14px;color:#5b6573;font-family:ui-monospace,Consolas,monospace\">Tab 4<\u002Fspan>\n      <span style=\"font-size:24px;font-weight:600\">Beteiligte<\u002Fspan>\n      <span style=\"font-size:14px;line-height:1.45;color:#5b6573;text-wrap:pretty\">Personen, Rollen und Bereiche verwalten<\u002Fspan>\n    <\u002Fdiv>\n    <div id=\"dwg-beteiligte\" data-screen-label=\"DWG-EG Beteiligte\" style=\"display:flex;flex-direction:column;gap:8px;min-width:0\">\n      <span style=\"font-size:13px;color:#5b6573;font-family:ui-monospace,Consolas,monospace\">DWG-EG · Beteiligte<\u002Fspan>\n      <div style=\"max-width:1320px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;padding:10px 14px;background:#fff;border:1px solid #d9dde3;border-radius:6px;font-size:13px;line-height:1.45;color:#262626\"><span style=\"font-weight:600;color:#10384f\">Inhalt<\u002Fspan><span style=\"text-wrap:pretty\">Tabelle Person, Firma, Rolle (Lieferverantwortlich, Bearbeitend, Prüfend, Lesend), Bereich, Status; Bearbeiten / Entfernen, Hinzufügen.<\u002Fspan><\u002Fdiv>\n      <dc-import name=\"Datenformular\" start-form=\"dwg\" start-tab=\"beteiligte\" show-concept=\"{{ false }}\" show-switcher=\"{{ false }}\" style=\"width:1320px\" hint-size=\"1320px,1000px\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div id=\"kv-beteiligte\" data-screen-label=\"KV-32 Beteiligte\" style=\"display:flex;flex-direction:column;gap:8px;min-width:0\">\n      <span style=\"font-size:13px;color:#5b6573;font-family:ui-monospace,Consolas,monospace\">KV-32 · Beteiligte<\u002Fspan>\n      <div style=\"max-width:1320px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;padding:10px 14px;background:#fff;border:1px solid #d9dde3;border-radius:6px;font-size:13px;line-height:1.45;color:#262626\"><span style=\"font-weight:600;color:#10384f\">Inhalt<\u002Fspan><span style=\"text-wrap:pretty\">Wie DWG; beim KV mit Bearbeitenden je Bereich (Kosten, Bezugsmengen), die fertig melden.<\u002Fspan><\u002Fdiv>\n      <dc-import name=\"Datenformular\" start-form=\"kv\" start-tab=\"beteiligte\" show-concept=\"{{ false }}\" show-switcher=\"{{ false }}\" style=\"width:1320px\" hint-size=\"1320px,1000px\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div id=\"thg-beteiligte\" data-screen-label=\"THG-32 Beteiligte\" style=\"display:flex;flex-direction:column;gap:8px;min-width:0\">\n      <span style=\"font-size:13px;color:#5b6573;font-family:ui-monospace,Consolas,monospace\">THG-32 · Beteiligte<\u002Fspan>\n      <div style=\"max-width:1320px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;padding:10px 14px;background:#fff;border:1px solid #d9dde3;border-radius:6px;font-size:13px;line-height:1.45;color:#262626\"><span style=\"font-weight:600;color:#10384f\">Inhalt<\u002Fspan><span style=\"text-wrap:pretty\">Wie DWG; Lieferverantwortlich ist die Ökobilanz-Fachperson.<\u002Fspan><\u002Fdiv>\n      <dc-import name=\"Datenformular\" start-form=\"thg\" start-tab=\"beteiligte\" show-concept=\"{{ false }}\" show-switcher=\"{{ false }}\" style=\"width:1320px\" hint-size=\"1320px,1000px\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div><\u002Fdiv>\n    <div><\u002Fdiv>\n    <div data-screen-label=\"Dokumente\" style=\"position:sticky;left:0;display:flex;flex-direction:column;gap:6px;padding-top:6px\">\n      <span style=\"font-size:14px;color:#5b6573;font-family:ui-monospace,Consolas,monospace\">Tab 5<\u002Fspan>\n      <span style=\"font-size:24px;font-weight:600\">Dokumente<\u002Fspan>\n      <span style=\"font-size:14px;line-height:1.45;color:#5b6573;text-wrap:pretty\">Pflicht- und Begleitdokumente<\u002Fspan>\n    <\u002Fdiv>\n    <div id=\"dwg-dokumente\" data-screen-label=\"DWG-EG Dokumente\" style=\"display:flex;flex-direction:column;gap:8px;min-width:0\">\n      <span style=\"font-size:13px;color:#5b6573;font-family:ui-monospace,Consolas,monospace\">DWG-EG · Dokumente<\u002Fspan>\n      <div style=\"max-width:1320px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;padding:10px 14px;background:#fff;border:1px solid #d9dde3;border-radius:6px;font-size:13px;line-height:1.45;color:#262626\"><span style=\"font-weight:600;color:#10384f\">Inhalt<\u002Fspan><span style=\"text-wrap:pretty\">Dokumente mit Pflicht / Optional; Vorlage CAD.V01 des BBL zum Herunterladen.<\u002Fspan><\u002Fdiv>\n      <dc-import name=\"Datenformular\" start-form=\"dwg\" start-tab=\"dokumente\" show-concept=\"{{ false }}\" show-switcher=\"{{ false }}\" style=\"width:1320px\" hint-size=\"1320px,1000px\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div id=\"kv-dokumente\" data-screen-label=\"KV-32 Dokumente\" style=\"display:flex;flex-direction:column;gap:8px;min-width:0\">\n      <span style=\"font-size:13px;color:#5b6573;font-family:ui-monospace,Consolas,monospace\">KV-32 · Dokumente<\u002Fspan>\n      <div style=\"max-width:1320px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;padding:10px 14px;background:#fff;border:1px solid #d9dde3;border-radius:6px;font-size:13px;line-height:1.45;color:#262626\"><span style=\"font-weight:600;color:#10384f\">Inhalt<\u002Fspan><span style=\"text-wrap:pretty\">Detaillierter KV (PDF, Pflicht), Positionen (Excel, optional).<\u002Fspan><\u002Fdiv>\n      <dc-import name=\"Datenformular\" start-form=\"kv\" start-tab=\"dokumente\" show-concept=\"{{ false }}\" show-switcher=\"{{ false }}\" style=\"width:1320px\" hint-size=\"1320px,1000px\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div id=\"thg-dokumente\" data-screen-label=\"THG-32 Dokumente\" style=\"display:flex;flex-direction:column;gap:8px;min-width:0\">\n      <span style=\"font-size:13px;color:#5b6573;font-family:ui-monospace,Consolas,monospace\">THG-32 · Dokumente<\u002Fspan>\n      <div style=\"max-width:1320px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;padding:10px 14px;background:#fff;border:1px solid #d9dde3;border-radius:6px;font-size:13px;line-height:1.45;color:#262626\"><span style=\"font-weight:600;color:#10384f\">Inhalt<\u002Fspan><span style=\"text-wrap:pretty\">Ökobilanz-Bericht, Tool-Export und Rechenhilfe Betrieb, alle Pflicht.<\u002Fspan><\u002Fdiv>\n      <dc-import name=\"Datenformular\" start-form=\"thg\" start-tab=\"dokumente\" show-concept=\"{{ false }}\" show-switcher=\"{{ false }}\" style=\"width:1320px\" hint-size=\"1320px,1000px\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div><\u002Fdiv>\n    <div><\u002Fdiv>\n    <div data-screen-label=\"Verlauf\" style=\"position:sticky;left:0;display:flex;flex-direction:column;gap:6px;padding-top:6px\">\n      <span style=\"font-size:14px;color:#5b6573;font-family:ui-monospace,Consolas,monospace\">Tab 6<\u002Fspan>\n      <span style=\"font-size:24px;font-weight:600\">Verlauf<\u002Fspan>\n      <span style=\"font-size:14px;line-height:1.45;color:#5b6573;text-wrap:pretty\">Alle Ereignisse mit Details<\u002Fspan>\n    <\u002Fdiv>\n    <div id=\"dwg-verlauf\" data-screen-label=\"DWG-EG Verlauf\" style=\"display:flex;flex-direction:column;gap:8px;min-width:0\">\n      <span style=\"font-size:13px;color:#5b6573;font-family:ui-monospace,Consolas,monospace\">DWG-EG · Verlauf<\u002Fspan>\n      <div style=\"max-width:1320px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;padding:10px 14px;background:#fff;border:1px solid #d9dde3;border-radius:6px;font-size:13px;line-height:1.45;color:#262626\"><span style=\"font-weight:600;color:#10384f\">Inhalt<\u002Fspan><span style=\"text-wrap:pretty\">Alle Ereignisse, neueste zuerst, mit Person und Detail.<\u002Fspan><span style=\"font-weight:600;color:#10384f\">Workflow<\u002Fspan><span style=\"text-wrap:pretty\">Erstellt → In Bearbeitung → Eingereicht → In Prüfung → Freigegeben → Übertragen; Zurückweisen führt zurück in die Bearbeitung.<\u002Fspan><\u002Fdiv>\n      <dc-import name=\"Datenformular\" start-form=\"dwg\" start-tab=\"verlauf\" show-concept=\"{{ false }}\" show-switcher=\"{{ false }}\" style=\"width:1320px\" hint-size=\"1320px,1000px\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div id=\"kv-verlauf\" data-screen-label=\"KV-32 Verlauf\" style=\"display:flex;flex-direction:column;gap:8px;min-width:0\">\n      <span style=\"font-size:13px;color:#5b6573;font-family:ui-monospace,Consolas,monospace\">KV-32 · Verlauf<\u002Fspan>\n      <div style=\"max-width:1320px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;padding:10px 14px;background:#fff;border:1px solid #d9dde3;border-radius:6px;font-size:13px;line-height:1.45;color:#262626\"><span style=\"font-weight:600;color:#10384f\">Inhalt<\u002Fspan><span style=\"text-wrap:pretty\">Wie DWG; zusätzlich Excel-Import, Fertigmeldungen der Bearbeitenden, entfernte Positionen.<\u002Fspan><\u002Fdiv>\n      <dc-import name=\"Datenformular\" start-form=\"kv\" start-tab=\"verlauf\" show-concept=\"{{ false }}\" show-switcher=\"{{ false }}\" style=\"width:1320px\" hint-size=\"1320px,1000px\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div id=\"thg-verlauf\" data-screen-label=\"THG-32 Verlauf\" style=\"display:flex;flex-direction:column;gap:8px;min-width:0\">\n      <span style=\"font-size:13px;color:#5b6573;font-family:ui-monospace,Consolas,monospace\">THG-32 · Verlauf<\u002Fspan>\n      <div style=\"max-width:1320px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;padding:10px 14px;background:#fff;border:1px solid #d9dde3;border-radius:6px;font-size:13px;line-height:1.45;color:#262626\"><span style=\"font-weight:600;color:#10384f\">Inhalt<\u002Fspan><span style=\"text-wrap:pretty\">Wie DWG; zusätzlich Tool-Export importiert, entfernte Emissionsquellen.<\u002Fspan><\u002Fdiv>\n      <dc-import name=\"Datenformular\" start-form=\"thg\" start-tab=\"verlauf\" show-concept=\"{{ false }}\" show-switcher=\"{{ false }}\" style=\"width:1320px\" hint-size=\"1320px,1000px\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div><\u002Fdiv>\n    <div><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
